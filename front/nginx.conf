http {
    # Глобальная map для WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}

server {
    listen 3000;  # nginx на 3000 (где фронт)
    
    # WebSocket прокси к Flask:5000
    location /ws {
        proxy_pass http://water_flask:5000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    
    # Или для Flask-SocketIO стандартный путь:
    location /socket.io/ {
        proxy_pass http://water_flask:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
    
    # API тоже проксируем
    location /api/ {
        proxy_pass http://water_flask:5000/api/;
        proxy_set_header Host $host;
    }
    
    # Остальное - фронт статика
    location / {
        root /path/to/frontend/build;
        try_files $uri /index.html;
    }
}
